<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>勝敗・レイティング計算</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><header class="site-header"><a class="back" href="../">← ホームへ戻る</a><p class="eyebrow">MATCH RATING</p><h1>勝敗・レイティング計算</h1><p>大会参加者のOCRテキストを貼り付けて、基準選手の増減を計算します。</p></header><section class="panel"><h2>① 参加者リストを貼り付け</h2><p class="hint">Googleレンズ等で大会の組み合わせ写真をテキスト化し、ここへ貼り付けてください。</p><textarea id="inputText" placeholder="会員番号、氏名、レイティングが含まれるテキストを貼り付け"></textarea><button id="parse" class="button primary full">参加者を読み込む</button><p id="status" class="status"></p></section><section id="membersPanel" class="panel hidden"><h2>② 現在のレイティング一覧</h2><div id="members" class="table-wrap"></div><h2 style="margin-top:18px">③ 基準選手</h2><div id="targets"></div></section><section id="matchPanel" class="panel hidden"><h2>④ 対戦の勝敗</h2><p class="hint">「勝ったらチェック、負けたら外す」</p><div id="checks" class="check-list"></div><div id="summary" class="summary" style="margin-top:12px"></div><div id="results" class="table-wrap" style="margin-top:12px"></div></section><section id="graphPanel" class="panel hidden"><h2>⑤ レイティング推移</h2><div class="two-col"><label>開始年<input id="startYear" type="number" value="2019" min="2000" max="2040"></label><label>終了年<input id="endYear" type="number" value="2026" min="2000" max="2040"></label></div><button id="graph" class="button primary full" style="margin-top:12px">グラフを表示</button><div class="chart-wrap" style="margin-top:12px"><canvas id="chart"></canvas></div></section><footer class="footer"><a href="../">ホームへ戻る</a></footer></main><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script><script src="app.js"></script></body></html>
