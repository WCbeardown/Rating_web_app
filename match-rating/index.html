<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>勝敗・レイティング計算</title><link rel="stylesheet" href="../style.css"></head><body><main class="container">
<a href="../index.html" class="small">← トップへ戻る</a><header class="header"><h1>羽曳野大会レイティンググループの勝敗計算とグラフ</h1><p id="lastUpdated" class="small">最終更新日：読み込み中</p></header>
