<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自分のリーグ分析</title><link rel="stylesheet" href="../style.css"></head><body><main class="container">
<p>自分のリーグの対戦相手を読み込んで、全員のレイティングの推移グラフ表示と、本日の対戦結果によるレイティング増減を計算します。</p>
<a href="../index.html" class="small">← トップへ戻る</a><header class="header"><h1>自分のリーグ分析</h1><p id="lastUpdated" class="small">最終更新日：読み込み中</p></header>
<section class="card"><h2>使い方</h2>
<img class="league-example" src="league-list-example.jpeg" alt="参加者リストの例">
<p>自分のリーグだけの組み合わせ写真を用意してください。Googleレンズでテキスト読み込みした文字列を下の欄に貼り付けてください。</p>
</section>
<section class="card">
<h2>参加者リスト</h2>
<textarea id="inputText" placeholder="ここにペーストして、下の「ペースト完了」を押してください。"></textarea>
<button id="confirm" class="btn" style="margin-top:10px">ペースト完了</button>
<div id="status" class="status"></div>
</section>
<section id="membersCard" class="card hidden"><h2>現在のレイティング一覧</h2><div id="members"></div></section>
<section id="calcCard" class="card hidden"><h2>基準選手を選択</h2><select id="target"></select><div id="opponents" style="margin-top:14px"></div><button id="calc" class="btn" style="margin-top:14px">勝敗を計算</button><div id="calcResult" style="margin-top:14px"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script></body></html>
