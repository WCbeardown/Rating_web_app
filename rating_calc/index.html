<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>レイティング計算</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">

<a href="../index.html" class="back">← トップへ戻る</a>

<header class="header">
  <p class="eyebrow">HABIKINO RATING</p>
  <h1>レイティング計算</h1>
  <p>自分のレイティングと対戦結果から、その日のレイティング増減を計算します。</p>
</header>

<section class="card">
  <h2>自分のレイティング</h2>
  <input id="myRating" class="rating-input" type="number" min="0" max="9999" step="1" placeholder="例：1700">
</section>

<section class="card">
  <h2>対戦結果</h2>
  <p class="hint">対戦相手のレイティングと勝敗を最大10試合まで入力してください。</p>

  <div class="table-wrap">
    <table class="input-table">
      <thead>
        <tr>
          <th>試合</th>
          <th>相手のレイティング</th>
          <th>勝敗</th>
        </tr>
      </thead>
      <tbody id="matchRows"></tbody>
    </table>
  </div>

  <button id="calcButton" class="btn primary">計算</button>
</section>

<section id="resultCard" class="card hidden">
  <h2>計算結果</h2>
  <div id="result"></div>
</section>

</main>
<script src="app.js"></script>
</body>
</html>
