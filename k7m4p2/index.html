<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>利用状況分析</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<main class="container">

<header class="header">
  <p class="eyebrow">HABIKINO RATING</p>
  <h1>利用状況分析</h1>
  <p>Rating Web App の利用状況を確認します。</p>
</header>

<section class="summary-grid">
  <div class="card summary-item">
    <span>総利用回数</span>
    <strong id="totalCount">-</strong>
  </div>

  <div class="card summary-item">
    <span>利用アプリ数</span>
    <strong id="appCount">-</strong>
  </div>

  <div class="card summary-item">
    <span>今日の利用回数</span>
    <strong id="todayCount">-</strong>
  </div>
</section>

<section class="card">
  <h2>アプリ別利用回数</h2>
  <div id="appStats">読み込み中...</div>
</section>

<section class="card">
  <h2>日別利用回数</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>日付</th>
          <th>利用回数</th>
        </tr>
      </thead>
      <tbody id="dailyStats"></tbody>
    </table>
  </div>
</section>

<section class="card">
  <h2>最近の利用</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>日時</th>
          <th>アプリ</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="recentStats"></tbody>
    </table>
  </div>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
