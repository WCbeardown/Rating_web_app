<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>レイティング比較</title><link rel="stylesheet" href="../style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head><body><main class="container">
<a href="../index.html" class="small">← トップへ戻る</a>
<header class="header"><h1>レイティング比較</h1><p>最初は2名です。必要に応じて「会員を追加」で最大6名まで追加できます。</p><p id="lastUpdated" class="small">最終更新日：読み込み中</p></header>
<section class="card">
<h2>条件</h2><div id="memberList"></div>
<button id="addMemberButton" class="btn light" type="button">＋ 会員を追加</button>
<div class="grid" style="margin-top:14px">
<div><label for="startYear">開始年</label><input id="startYear" type="number" min="2000" max="2040" value="2019"></div>
<div><label for="endYear">終了年</label><input id="endYear" type="number" min="2000" max="2040" value="2026"></div>
</div>
<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
<button id="searchButton" class="btn" type="button">グラフ・表を表示</button>
<button id="resetButton" class="btn secondary" type="button">リセット</button>
</div>
<div id="status" class="status small">データ読み込み中…</div>
</section>
<section id="results" class="hidden">
<div class="card"><h2>レイティング比較グラフ</h2><div class="chart-wrap"><canvas id="ratingChart"></canvas></div></div>
<div class="card"><h2>レイティング 年平均比較表</h2><div id="averageTable" class="table-wrap"></div></div>
<div class="card"><h2>分析データ</h2><div id="statsTable" class="table-wrap"></div></div>
<div class="card"><h2>個人データ</h2><div id="detailTables"></div></div>
</section>
</main><script src="app.js"></script></body></html>
