<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>入賞者検索</title><link rel="stylesheet" href="../style.css"></head><body><main class="container">
<a href="../index.html" class="small">← トップへ戻る</a><header class="header"><h1>レイティング 入賞者検索</h1>
<p>苗字・名前・チーム名のいずれか一つを入力してから「検索」ボタンを押してください</p><p>注意）羽曳野レイティングのみ。54回（2015年）以降のデータです。</p><p id="lastUpdated" class="small"></p></header>
<section class="card"><div class="grid">
<div><label>苗字入力</label><input id="surname"></div>
<div><label>名前入力</label><input id="given"></div>
<div><label>チーム名入力</label><input id="team"></div>
</div><div style="margin-top:14px"><button id="search" class="btn">検索</button></div><div id="status" class="status"></div></section>
<section id="results" class="hidden"><div class="card"><h2>総表彰回数</h2><div id="total"></div></div>
<div class="card"><h2>クラス・部・順位別集計</h2><div id="summary" class="table-wrap"></div></div>
<div class="card"><h2>詳細表示</h2><div id="detail" class="table-wrap"></div></div></section>
</main><script src="app.js"></script></body></html>
